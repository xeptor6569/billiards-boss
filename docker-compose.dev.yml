# Dev environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    container_name: billiards-boss-db-dev
    # Override env_file to load dev-specific environment
    # Order: .env (base) -> .env.development (overrides)
    env_file:
      - .env
      - .env.development
    # Preserve environment variables from base docker-compose.yml
    # These are required for PostgreSQL to start
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billiards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiards}
      POSTGRES_DB: ${POSTGRES_DB:-billiards_boss}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # Dev uses 5433
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - billiards-network-dev

  app:
    container_name: billiards-boss-app-dev
    # Override env_file to load dev-specific environment
    # Order: .env (base) -> .env.development (overrides)
    env_file:
      - .env
      - .env.development
    environment:
      # Explicitly set DATABASE_URL to ensure correct database name
      # Uses service name 'postgres' (Docker Compose service name, not container name)
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiards}:${POSTGRES_PASSWORD:-billiards}@postgres:5432/${POSTGRES_DB:-billiards_boss}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${APP_PORT:-3001}:3000"  # Dev uses 3001
    networks:
      - billiards-network-dev

volumes:
  postgres_data_dev:

networks:
  billiards-network-dev:
    driver: bridge
