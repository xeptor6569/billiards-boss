services:
  postgres:
    image: postgres:16-alpine
    container_name: billiards-boss-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billiards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiards}
      POSTGRES_DB: ${POSTGRES_DB:-billiards_boss}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pg_data_local:/var/lib/postgresql/data