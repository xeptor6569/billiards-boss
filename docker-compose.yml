services:
  postgres:
    image: postgres:16-alpine
    container_name: billiards-boss-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billiards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiards}
      POSTGRES_DB: ${POSTGRES_DB:-billiards_boss}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billiards}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billiards-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billiards-boss-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiards}:${POSTGRES_PASSWORD:-billiards}@postgres:5432/${POSTGRES_DB:-billiards_boss}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - billiards-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  billiards-network:
    driver: bridge

