name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allow manual triggering

env:
  DEPLOY_ENV: production
  DEPLOY_URL: billiardsboss.com

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    # Optional: Use a label to target a specific runner
    # runs-on: [self-hosted, production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for git commands

      - name: Generate build info
        id: build-info
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "✅ Build info: v$(node -p "require('./package.json').version").$BUILD_NUMBER ($COMMIT_HASH)"

      - name: Deploy to server
        env:
          BUILD_NUMBER: ${{ steps.build-info.outputs.build_number }}
          COMMIT_HASH: ${{ steps.build-info.outputs.commit_hash }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -e
          
          # Validate deployment path
          if [ -z "$DEPLOY_PATH" ]; then
            echo "❌ Error: PROD_DEPLOY_PATH secret is not set!"
            exit 1
          fi
          
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "❌ Error: Deployment directory does not exist: $DEPLOY_PATH"
            echo "💡 Create it with: sudo mkdir -p $DEPLOY_PATH && sudo chown \$USER:\$USER $DEPLOY_PATH"
            exit 1
          fi
          
          cd "$DEPLOY_PATH"
          
          # Fix git safe.directory issue (Git 2.35.2+ security feature)
          git config --global --add safe.directory "$DEPLOY_PATH" || true
          
          echo "📥 Pulling latest changes from main branch..."
          git fetch origin
          git checkout main
          git pull origin main
          
          # Check for environment file (.env.production preferred, fallback to .env)
          if [ -f .env.production ]; then
            echo "✅ Found .env.production file"
            set -a
            source .env.production
            set +a
          elif [ -f .env ]; then
            echo "⚠️  Using .env file (consider creating .env.production for production-specific config)"
            set -a
            source .env
            set +a
          else
            echo "❌ Error: No .env.production or .env file found!"
            echo "💡 Create .env.production from .env.example.production template"
            exit 1
          fi
          
          # Validate required environment variables
          if [ -z "$NEXTAUTH_SECRET" ]; then
            echo "❌ Error: NEXTAUTH_SECRET is not set in environment file!"
            exit 1
          fi
          
          echo "📦 Setting build info environment variables..."
          export BUILD_NUMBER="$BUILD_NUMBER"
          export COMMIT_HASH="$COMMIT_HASH"
          
          echo "🛑 Stopping existing containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down 2>/dev/null || true
          
          echo "🐳 Building and starting containers..."
          BUILD_NUMBER="$BUILD_NUMBER" COMMIT_HASH="$COMMIT_HASH" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          
          echo "⏳ Waiting for services to be ready..."
          sleep 20
          
          echo "📊 Running database migrations..."
          docker compose exec -T app npm run db:migrate || echo "⚠️  Migration failed or already applied"
          
          echo "🌱 Seeding database..."
          docker compose exec -T app npm run db:seed || echo "⚠️  Seeding failed or already done"
          
          echo "🏥 Checking application health..."
          sleep 5
          # APP_PORT should already be loaded from .env.production, default to 3000 if not set
          APP_PORT=${APP_PORT:-3000}
          if curl -f http://localhost:${APP_PORT}/api/health > /dev/null 2>&1; then
            echo "✅ Application is healthy!"
          else
            echo "⚠️  Health check failed, but containers are running"
            echo "💡 Prod app runs on port ${APP_PORT}"
          fi
          
          echo "✅ Deployment complete!"
          echo "🌐 Application available at: https://billiardsboss.com"

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production (billiardsboss.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: master/main" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ steps.build-info.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.build-info.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY

