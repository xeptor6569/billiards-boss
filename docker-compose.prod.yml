# Production Docker Compose configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    container_name: billiards-boss-db-prod
    restart: always
    # Override env_file to load production-specific environment
    # Order: .env (base) -> .env.production (overrides)
    env_file:
      - .env
      - .env.production
    # Preserve environment variables from base docker-compose.yml
    # These are required for PostgreSQL to start
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billiards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiards}
      POSTGRES_DB: ${POSTGRES_DB:-billiards_boss}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"  # Prod uses 5434
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - billiards-network-prod

  app:
    container_name: billiards-boss-app-prod
    # Override env_file to load production-specific environment
    # Order: .env (base) -> .env.production (overrides)
    env_file:
      - .env
      - .env.production
    environment:
      NODE_ENV: production
      # Override with production URLs
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: always
    # Port mapping for reverse proxy access
    # If Nginx is in a different Docker stack, bind to all interfaces (0.0.0.0)
    # so Nginx can reach it via the VM's LAN IP
    ports:
      - "0.0.0.0:${APP_PORT:-3000}:3000"  # Prod uses APP_PORT (default 3000, accessible from LAN IP for Nginx)
      # Alternative if Nginx is on same host: "127.0.0.1:${APP_PORT:-3000}:3000" (localhost only)
    networks:
      - billiards-network-prod

volumes:
  postgres_data_prod:

networks:
  billiards-network-prod:
    driver: bridge

