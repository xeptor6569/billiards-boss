# Production Docker Compose configuration for dev.billiardsboss.com
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    environment:
      NODE_ENV: production
      # Override with production URLs
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: always
    # Remove port mapping if using reverse proxy (Nginx)
    # ports:
    #   - "3000:3000"
    # Or keep it for direct access during setup
    ports:
      - "127.0.0.1:3000:3000"  # Only accessible from localhost

  postgres:
    restart: always
    # Consider adding backup volume
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: backup directory
      # - ./backups:/backups

